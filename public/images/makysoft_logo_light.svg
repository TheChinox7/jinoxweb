<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">MAKYSOFT logo para fondo oscuro</title>
  <desc id="desc">Logo de MAKYSOFT en blanco, azul claro y cian para fondos oscuros.</desc>
  <defs>
    <linearGradient id="cloudGradientLight" x1="145" y1="0" x2="555" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DDFFF"/>
      <stop offset="1" stop-color="#D6FAFF"/>
    </linearGradient>
    <linearGradient id="leftMGradientLight" x1="200" y1="330" x2="370" y2="465" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="0.58" stop-color="#A9D8FF"/>
      <stop offset="1" stop-color="#72B8FF"/>
    </linearGradient>
    <linearGradient id="rightMGradientLight" x1="350" y1="455" x2="510" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B5F8FF"/>
      <stop offset="0.48" stop-color="#62E3F1"/>
      <stop offset="1" stop-color="#8FC6FF"/>
    </linearGradient>
    <linearGradient id="softTextGradientLight" x1="1180" y1="0" x2="1690" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62E3F1"/>
      <stop offset="1" stop-color="#B8FAFF"/>
    </linearGradient>
    <filter id="lightLogoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <g transform="translate(30,0)" filter="url(#lightLogoShadow)">
    <path d="M165 316
             C165 262 206 222 260 222
             C274 159 323 126 383 126
             C442 126 493 161 506 223
             C557 223 596 262 596 314"
          fill="none" stroke="url(#cloudGradientLight)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M212 444 L212 330 L372 460"
          fill="none" stroke="url(#leftMGradientLight)" stroke-width="72"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M372 460 L532 330 L532 444"
          fill="none" stroke="url(#rightMGradientLight)" stroke-width="72"
          stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="none" stroke="#B6F6FF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M330 270 L292 298 L330 326"/>
      <path d="M414 270 L452 298 L414 326"/>
      <path d="M390 258 L356 338"/>
    </g>
  </g>

  <text x="665" y="385"
        font-family="Nunito Sans, Arial Rounded MT Bold, Avenir Next, Arial, sans-serif"
        font-size="162" font-weight="800" letter-spacing="5">
    <tspan fill="#F4F8FF">MAKY</tspan><tspan fill="url(#softTextGradientLight)">SOFT</tspan>
  </text>
</svg>
