<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MAKYSOFT favicon</title>
  <desc id="desc">Blue and cyan MAKYSOFT symbol inside a white rounded container.</desc>
  <defs>
    <linearGradient id="leftMGradient" x1="230" y1="420" x2="510" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173B81"/>
      <stop offset="0.55" stop-color="#0D58B8"/>
      <stop offset="1" stop-color="#0C3F94"/>
    </linearGradient>
    <linearGradient id="rightMGradient" x1="505" y1="720" x2="795" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13C9DD"/>
      <stop offset="0.45" stop-color="#0D9FD0"/>
      <stop offset="1" stop-color="#16428D"/>
    </linearGradient>
    <linearGradient id="codeGradient" x1="360" y1="300" x2="660" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F9FD0"/>
      <stop offset="1" stop-color="#13C7D9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0A2B67" flood-opacity="0.10"/>
    </filter>
    <filter id="containerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0A2B67" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="232"
        fill="#FFFFFF" filter="url(#containerShadow)"/>

  <g transform="translate(128 128) scale(0.75)" filter="url(#softShadow)">
    <!-- Rounded M -->
    <path d="M250 720 L250 430 L510 700"
          fill="none" stroke="url(#leftMGradient)" stroke-width="124"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M510 700 L774 430 L774 720"
          fill="none" stroke="url(#rightMGradient)" stroke-width="124"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Code symbol -->
    <g fill="none" stroke="url(#codeGradient)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <path d="M430 285 L360 338 L430 391"/>
      <path d="M592 285 L662 338 L592 391"/>
      <path d="M555 258 L475 418"/>
    </g>
  </g>
</svg>
