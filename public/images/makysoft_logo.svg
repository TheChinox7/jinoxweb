<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">MAKYSOFT logo</title>
  <desc id="desc">Minimal rounded software company logo with a blue and cyan M, cloud and code symbol.</desc>
  <defs>
    <linearGradient id="cloudGradient" x1="145" y1="0" x2="555" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D65D8"/>
      <stop offset="1" stop-color="#12C7D9"/>
    </linearGradient>
    <linearGradient id="leftMGradient" x1="200" y1="330" x2="370" y2="465" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173B81"/>
      <stop offset="0.58" stop-color="#0D58B8"/>
      <stop offset="1" stop-color="#0C3F94"/>
    </linearGradient>
    <linearGradient id="rightMGradient" x1="350" y1="455" x2="510" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13C9DD"/>
      <stop offset="0.45" stop-color="#0D9FD0"/>
      <stop offset="1" stop-color="#16428D"/>
    </linearGradient>
    <linearGradient id="softTextGradient" x1="1180" y1="0" x2="1690" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA9D2"/>
      <stop offset="1" stop-color="#12C2D6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0A2B67" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g transform="translate(30,0)" filter="url(#softShadow)">
    <!-- Minimal cloud outline -->
    <path d="M165 316
             C165 262 206 222 260 222
             C274 159 323 126 383 126
             C442 126 493 161 506 223
             C557 223 596 262 596 314"
          fill="none" stroke="url(#cloudGradient)" stroke-width="28"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rounded M symbol -->
    <path d="M212 444 L212 330 L372 460"
          fill="none" stroke="url(#leftMGradient)" stroke-width="72"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M372 460 L532 330 L532 444"
          fill="none" stroke="url(#rightMGradient)" stroke-width="72"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Code mark -->
    <g fill="none" stroke="#11B8D5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M330 270 L292 298 L330 326"/>
      <path d="M414 270 L452 298 L414 326"/>
      <path d="M390 258 L356 338"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="665" y="385"
        font-family="Nunito Sans, Arial Rounded MT Bold, Avenir Next, Arial, sans-serif"
        font-size="162" font-weight="800" letter-spacing="5">
    <tspan fill="#173B81">MAKY</tspan><tspan fill="url(#softTextGradient)">SOFT</tspan>
  </text>
</svg>
